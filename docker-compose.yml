services:
  db:
    image: mysql:8
    container_name: wikisguessr-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - dbdata:/var/lib/mysql
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - wikisnet

  api:
    build:
      context: ./backend
    container_name: wikisguessr-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      APP_URL: ${APP_URL}
      DB_HOST: db
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      CORS_ORIGIN: ${CORS_ORIGIN}
      BREVO_API_KEY: ${BREVO_API_KEY}
      BREVO_SENDER_EMAIL: ${BREVO_SENDER_EMAIL}
      BREVO_SENDER_NAME: ${BREVO_SENDER_NAME}
      OFFLINE_DEMO_MODE: ${OFFLINE_DEMO_MODE}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.1-flash-lite}
      GEMINI_DAILY_REQUEST_LIMIT: ${GEMINI_DAILY_REQUEST_LIMIT:-500}
      GEMINI_DAILY_TOKEN_LIMIT: ${GEMINI_DAILY_TOKEN_LIMIT:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      STRIPE_SILVER_PRICE_ID: ${STRIPE_SILVER_PRICE_ID}
      STRIPE_GOLD_PRICE_ID: ${STRIPE_GOLD_PRICE_ID}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - avatar_data:/app/uploads
    networks:
      - wikisnet

  app:
    build:
      context: ./frontend
    container_name: wikisguessr-app
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "127.0.0.1:3010:80"
    networks:
      - wikisnet

volumes:
  dbdata:
  avatar_data:

networks:
  wikisnet:
    driver: bridge
